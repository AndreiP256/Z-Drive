spring.application.name=z-drive

# DB Config
spring.datasource.url=jdbc:postgresql://localhost:5432/zdrive
spring.datasource.username=postgres
spring.datasource.password=pass123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate magic (creează tabelele automat)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File handling

# Enable multipart uploads
spring.servlet.multipart.enabled=true

# Threshold after which files are written to disk (prevents memory issues)
spring.servlet.multipart.file-size-threshold=2KB

# Max size of a single file (adjust based on your Z-Drive requirements)
spring.servlet.multipart.max-file-size=50MB

# Max total request size (file + other @RequestParams)
spring.servlet.multipart.max-request-size=100MB

# Remote file storage (MinIO) configuration
z-drive.storage.endpoint=http://localhost:9000
z-drive.storage.access-key=admin
z-drive.storage.secret-key=password123
z-drive.storage.bucket-name=user-files