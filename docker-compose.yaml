services:
  db:
    image: postgres:15
    container_name: zdrive-db
    environment:
      POSTGRES_DB: zdrive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
    ports:
      - "5432:5432"
    volumes:
      - zdrive-db-data:/var/lib/postgresql/data

  zdrive-storage:
    image: minio/minio
    container_name: zdrive-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"

volumes:
  zdrive-db-data: